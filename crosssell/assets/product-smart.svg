<svg xmlns="http://www.w3.org/2000/svg" width="152" height="168" viewBox="0 0 152 168" role="img" aria-label="Smart Charge wallbox 22kW with solar">
  <defs>
    <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7A4C"/>
      <stop offset="1" stop-color="#223D32"/>
    </linearGradient>
  </defs>
  <rect width="152" height="168" fill="url(#gS)"/>
  <!-- sun / solar accent -->
  <g stroke="#F5A623" stroke-width="3" stroke-linecap="round">
    <circle cx="112" cy="30" r="7" fill="#F5A623" stroke="none"/>
    <line x1="112" y1="14" x2="112" y2="19"/>
    <line x1="126" y1="30" x2="131" y2="30"/>
    <line x1="122" y1="20" x2="126" y2="16"/>
  </g>
  <!-- premium wallbox unit -->
  <rect x="50" y="40" width="52" height="64" rx="13" fill="rgba(255,255,255,0.18)" stroke="#fff" stroke-width="4"/>
  <rect x="60" y="52" width="32" height="16" rx="4" fill="rgba(255,255,255,0.35)"/>
  <path d="M78 74 L69 86 H76 L74 96 L84 82 H77 Z" fill="#fff"/>
  <!-- cable -->
  <path d="M76 104 C 76 122, 44 122, 44 138" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="76" y="152" fill="#fff" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">22 kW</text>
