<svg xmlns="http://www.w3.org/2000/svg" width="152" height="168" viewBox="0 0 152 168" role="img" aria-label="Comfort Charge wallbox 11kW">
  <defs>
    <linearGradient id="gC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E8C5C"/>
      <stop offset="1" stop-color="#2C6B43"/>
    </linearGradient>
  </defs>
  <rect width="152" height="168" fill="url(#gC)"/>
  <!-- wallbox unit -->
  <rect x="52" y="34" width="48" height="60" rx="12" fill="rgba(255,255,255,0.16)" stroke="#fff" stroke-width="4"/>
  <!-- screen + bolt -->
  <circle cx="76" cy="58" r="12" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M78 50 L70 60 H76 L74 68 L82 57 H76 Z" fill="#fff"/>
  <!-- coiled cable -->
  <path d="M76 94 C 76 112, 104 112, 104 128 C 104 140, 92 140, 92 132" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
  <text x="76" y="150" fill="#fff" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">11 kW</text>
</svg>
