<svg xmlns="http://www.w3.org/2000/svg" width="152" height="168" viewBox="0 0 152 168" role="img" aria-label="Basic Charge portable cable">
  <defs>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E9A6B"/>
      <stop offset="1" stop-color="#377E51"/>
    </linearGradient>
  </defs>
  <rect width="152" height="168" fill="url(#gB)"/>
  <!-- portable connector -->
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="58" y="40" width="36" height="46" rx="10" fill="rgba(255,255,255,0.14)"/>
    <line x1="68" y1="52" x2="68" y2="62"/>
    <line x1="84" y1="52" x2="84" y2="62"/>
    <line x1="76" y1="70" x2="76" y2="76"/>
    <!-- cable -->
    <path d="M76 86 C 76 112, 40 116, 40 138" stroke-width="5"/>
  </g>
  <text x="76" y="150" fill="#fff" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">7 kW</text>
